<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=7, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="header">
        <a class="logo-rep border" href="home.html">
            <img class="amazon-logo" src="images/amazon-logo-white.png">
        </a>
        <form class="amazon-form">
           <div class="box">
               <input type="text" class="amazon-search">
               <button class = "search-logo-btn">
               <img class="search-logo-img" src="images/icons/search-icon.png" >
            </button>
            </div>
        </form>

        <div class="lang-wrapper">
            <div class="lang-btn">
                <img src="" alt="">
                <span id="langText">EN</span>
                <span class="arrow">🔻</span>
            </div>
            <div class="lang-dropdown">
                <h4>change language</h4>
                <label><input type="radio" value="EN" name="lang">ENGLISH - EN</label>
                <label><input type="radio" value="UR" name="lang">urdu - ur</label>
                <label><input type="radio" value="CH" name="lang">chinese -ch</label>
                <label><input type="radio" value="KO" name="lang">korean - ko</label>
            
               <h4>Change currency</h4>
               <label><input type="radio" name="currency" value="PKR" checked> PKR - Pakistani Rupee</label>
               <label><input type="radio" name="currency" value="USD"> $ - USD - US Dollar</label>

               <p class="shopping-note">You are shopping on Amazon.com</p>
            </div>
        </div>

        <a href="">
        <div class="returns border" >
            <div class="return1">Returns</div>
            <div class="return2">& Orders</div>
        </div></a>


        <a class="cart border" href="checkout.html">
            
           
                <div class="cart-num">0</div>
                <img class="cart-logo" src="images/icons/cart-icon.png" alt="">
                <div class="cart-name">Cart</div>
           </a>  
       
    </div>

    <div class="container-grid">
    
    </div>
    

    
    
    
    <script type="module" src="js-files/home_page_new.js"></script>
   
  
</body>
</html>
