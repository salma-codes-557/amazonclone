<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    
<div class="large">


    <div class="js-div">

</div>

    <div class="small">
    <div class="heading">Review your order</div>
    <div class="order-summary">
        <div class="main-heading">Order Summary</div>
        <div class="summery">
            <div>Items(<span class="itemquantity">0</span>):</div>
            <div class="items">$0</div>
        </div>
         <div class="summery">
            <div>Shipping & handling:</div>
            <div class="shipping">$0.00</div>
        </div>
             <div class="summery">
            <div></div>
            <div class="line"></div>
        </div>
         <div class="summery">
            <div>Total before tax:</div>
            <div class="before-tax">$0.00</div>
        </div>
         <div class="summery">
            <div>Estimated tax(10):</div>
            <div class="tax">$12.00</div>
        </div>

        <div class="summery">
            <div></div>
            <div class="last-line"></div>
        </div>
         
        <div class="summery total">
            <div>Order total:</div>
            <div class="totalprice">0.00</div>
        </div>

        <button class="place-ur-order">Place your order</button></div>
</div>
    </div>
  

  
    <script type="module" src="js-files/checkout.js"></script>
</body>
</html>
